[package]
name = "sparktop"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Terminal resource monitor for NVIDIA DGX Spark clusters: GPU, unified memory, network and vLLM metrics over agentless SSH"
license = "GPL-3.0-only"
repository = "https://github.com/nero-/sparktop"
readme = "README.md"
keywords = ["monitoring", "tui", "gpu", "vllm", "dgx-spark"]
categories = ["command-line-utilities", "visualization"]
exclude = ["docs/", "scripts/"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
openssh = "0.11.6"
openssh-keys = "0.6.5"
parking_lot = "0.12.5"

[profile.release]
opt-level = 2
