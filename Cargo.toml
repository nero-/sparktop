[package]
name = "sparktop"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
openssh = "0.11.6"
openssh-keys = "0.6.5"
parking_lot = "0.12.5"

[profile.release]
opt-level = 2
